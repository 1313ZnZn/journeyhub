<style>
:root{--bg:#f6f6f1;--paper:#fff;--ink:#17352d;--muted:#68776f;--line:#e0e6df;--forest:#155846;--deep:#113e32;--mint:#e7f1e9;--gold:#f2bc61;--amber:#fff2d8;--red:#a84235;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.55}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--forest)}h1,h2,h3,p{margin:0}h1{font-size:clamp(32px,3.1vw,46px);line-height:1.12;letter-spacing:-1.7px;font-weight:650}h2{font-size:23px;letter-spacing:-.6px;line-height:1.25}h3{font-size:16px;font-weight:650}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase}.row{display:flex;gap:12px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:grid;gap:16px}.tight{display:grid;gap:6px}.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;padding:5px 9px;border-radius:7px;background:var(--mint);white-space:nowrap}.badge.amber{background:var(--amber);color:#775219}.badge.gray{background:#eef0eb;color:var(--muted)}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.mark{width:31px;height:31px;background:var(--forest);color:#fff;border-radius:10px;display:grid;place-items:center;font-size:24px}.brand{font-weight:750;font-size:17px;letter-spacing:-.7px}.brand .sub{display:block;font-size:9px;letter-spacing:2.4px;text-transform:uppercase;font-weight:500;color:var(--muted);line-height:1}.top{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--line);background:#fafbf7;gap:20px}.top nav{display:flex;gap:5px}.nav{padding:11px 15px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px}.nav.active{background:var(--mint);color:var(--forest);font-weight:700}.avatar{width:33px;height:33px;border-radius:50%;background:#e7e5da;display:grid;place-items:center;font-size:11px;font-weight:700}.notice{border-bottom:1px solid #e9dfc7;background:#faf3e5;color:#7a6035;font-size:11px;text-align:center;padding:7px 16px;letter-spacing:.1px}.wrap{max-width:1330px;margin:auto;padding:36px 40px 48px}.page-heading{margin-bottom:28px;display:flex;justify-content:space-between;gap:24px;align-items:flex-end}.page-heading p{margin-top:12px;font-size:15px;color:var(--muted);max-width:590px}.pill{border:1px solid var(--line);background:#fff;border-radius:30px;padding:9px 13px;display:inline-flex;align-items:center;gap:7px;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:24px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 5px 18px #183e2b04}.pad{padding:24px}.panel-title{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.bubble-icon{width:38px;height:38px;background:var(--mint);color:var(--forest);border-radius:12px;display:grid;place-items:center;flex-shrink:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px;font-size:11px;font-weight:650;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4dc;border-radius:10px;padding:12px;background:#fcfdfb;color:var(--ink);font-size:13px;font-weight:450;min-height:45px}.field textarea{resize:vertical;min-height:85px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:8px 12px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:30px;color:var(--muted)}.chip[aria-pressed=true]{background:var(--mint);color:var(--forest);border-color:#bdcfc3}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--forest);padding:12px 17px;background:var(--forest);color:#fff;font-size:12px;font-weight:650;text-decoration:none;min-height:44px}.btn.secondary{color:var(--ink);border-color:var(--line);background:#fff}.btn.gold{background:var(--gold);color:var(--deep);border-color:var(--gold)}.btn.plain{border-color:transparent;background:transparent;color:var(--forest);padding:6px}.full{width:100%}.rule{height:1px;background:var(--line)}.context{padding:13px 15px;background:#f4f7f1;border-radius:12px;display:flex;gap:10px;font-size:12px;color:#5b6f61}.context .icon{color:var(--forest)}.hero-card{background:var(--deep);color:white;padding:26px;border-radius:var(--radius);position:relative;overflow:hidden}.hero-card p{color:#c4d6c8;font-size:13px;margin-top:10px}.hero-card .eyebrow{color:#c5d9bc}.orbit{position:absolute;right:-22px;top:-34px;width:185px;height:185px;border-radius:50%;border:1px solid #ffffff13;pointer-events:none}.orbit:after{content:'';position:absolute;inset:24px;border:1px solid #ffffff15;border-radius:50%}.journey-step{display:flex;gap:14px;padding:15px 0}.journey-step+.journey-step{border-top:1px solid var(--line)}.number{width:26px;height:26px;background:#eef2eb;color:var(--forest);border-radius:50%;display:grid;place-items:center;font-size:11px;flex-shrink:0}.journey-step p{font-size:12px;color:var(--muted);margin-top:3px}.mini-trip{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center}.mini-trip img{width:70px;height:65px;object-fit:cover;border-radius:10px}.trip-card{display:grid;grid-template-columns:150px 1fr;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff}.trip-card img{width:150px;height:100%;min-height:180px;object-fit:cover}.trip-content{padding:18px;display:grid;gap:10px}.trip-time{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--forest)}.timeline{position:relative;display:grid;gap:15px}.transfer{font-size:11px;color:var(--muted);padding-left:17px;border-left:2px dotted #cad6cc;margin:0 0 0 22px}.why{font-size:12px;color:var(--muted)}.price{font-size:14px;font-weight:700}.moneyline{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:7px 0}.moneyline.total{border-top:1px solid var(--line);margin-top:10px;padding-top:15px;font-weight:750;font-size:18px}.feedback{font-size:12px;background:var(--mint);padding:15px;border-radius:10px;color:var(--forest)}.feedback.error{color:var(--red);background:#fbede9}.chat{background:#f5f8f3;border:1px solid #e0e9dc;border-radius:16px;padding:19px;font-size:13px;display:grid;gap:11px}.chat ul{padding-left:17px;margin:0}.task{padding:20px;border:1px solid var(--line);border-radius:14px;background:#fff;display:grid;gap:13px}.task-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.track{display:flex;gap:4px}.track span{height:3px;flex:1;background:var(--line);border-radius:3px}.track span.done{background:#6a9a7c}.checkline{display:flex;gap:11px;align-items:flex-start;font-size:13px;padding:12px 0}.checkline input{accent-color:var(--forest);margin-top:5px}.tasklog{padding-left:15px;border-left:1px solid #cedacc;font-size:12px;color:var(--muted);display:grid;gap:9px}.empty{padding:40px 25px;text-align:center;display:grid;justify-items:center;gap:14px}.statusline{display:flex;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.statusline:last-child{border-bottom:0}.connection{padding:20px;border:1px solid var(--line);border-radius:14px;background:#fff;display:grid;gap:14px}.blueprint{display:grid;gap:24px}.blueprint table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}.blueprint th,.blueprint td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.blueprint th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;background:#f6f8f4}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.flow>div{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff}.flow p{font-size:12px;color:var(--muted);margin-top:9px}.blueprint ol,.blueprint ul{padding-left:18px;display:grid;gap:9px;font-size:13px}.mobile-name{display:none}.footnote{margin-top:26px;display:flex;justify-content:space-between;gap:16px;font-size:10px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:22px;max-width:600px;width:calc(100% - 30px);padding:0;color:var(--ink);box-shadow:0 28px 90px #0d302539}dialog::backdrop{background:#0b231d75;backdrop-filter:blur(3px)}.modal-top{padding:22px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;font-size:23px;color:var(--muted);width:32px;height:32px}.modal-body{padding:23px 25px;max-height:70vh;overflow:auto;display:grid;gap:15px}.scroll-table{overflow:auto}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--deep);color:white;padding:13px 21px;border-radius:12px;box-shadow:0 5px 30px #0002;z-index:10;font-size:12px;max-width:90%}.connection a{font-size:12px}.removed{opacity:.5}.menu-small{display:none}.notes{padding:18px 22px;border-left:3px solid var(--gold);background:#faf6eb;border-radius:0 10px 10px 0;font-size:12px}.plan-controls{display:flex;flex-wrap:wrap;gap:8px}.split-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}

</style></head><body>
<header class="top"><a class="brand row" href="./" aria-label="Open Journey Hub catalog" style="color:inherit;text-decoration:none"><span class="mark">◇</span><span>Journey Hub<span class="sub">Go with a little wonder</span></span></a><nav aria-label="Main navigation" id="nav"></nav><div class="row"><span class="badge amber status"><span class="dot"></span> Design preview</span><span class="avatar" aria-label="Example traveler">TR</span></div></header>
<div class="notice">INTERACTIVE DESIGN PREVIEW · Example plans and simulated tasks · AI, ticketing and email services are not connected</div>
<main class="wrap" id="main"></main><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div class="toast hidden" role="status" id="toast"></div>
<script>
'use strict';
const CATALOG=__CATALOG__;
const icons={spark:'M10 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z M18 15l1 3 3 1-3 1-1 3-1-3-3-1 3-1z',map:'M3 5l6-2 6 2 6-2v16l-6 2-6-2-6 2z M9 3v16 M15 5v16',check:'M5 12l4 4L19 6',clock:'M12 8v5l3 2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',ticket:'M3 5h18v5a2 2 0 0 0 0 4v5H3v-5a2 2 0 0 0 0-4z M15 5v14',arrow:'M5 12h14 M13 6l6 6-6 6',mail:'M3 5h18v14H3z M3 5l9 8 9-8',task:'M9 6h12 M9 12h12 M9 18h12 M3 6h1 M3 12h1 M3 18h1',link:'M9 15l6-6 M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0 M16 8l2-2a4 4 0 0 0-6-6L7 5',shield:'M12 3l8 3v7c0 5-8 8-8 8s-8-3-8-8V6z M8 12l3 3 5-6',edit:'M4 17l-1 4 4-1L20 7l-4-4z M13 6l4 4',pin:'M18 9c0 5-6 12-6 12S6 14 6 9a6 6 0 1 1 12 0z M14 9a2 2 0 1 1-4 0 2 2 0 0 1 4 0',book:'M3 4h7l2 2 2-2h7v16h-7l-2 2-2-2H3z M12 6v16'};
const icon=n=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+icons[n]+'"/></svg>';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'THB '+Number(n).toLocaleString('en-US');
const dates=()=>{const d=new Date();d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)};
const S={view:'plan',city:'Shanghai',date:dates(),travelers:2,budget:9000,interests:['Culture','Food'],notes:'A relaxed day with local food and a little time to wander.',plan:false,removed:[],saved:false,reminder:false,taskState:'draft',taskLog:[],busy:false};
const pages=[['plan','Plan a trip','spark'],['itinerary','My itinerary','map'],['tasks','Agent tasks','task'],['blueprint','Design brief','book']];
const cityInfo={Shanghai:{tz:'Asia/Shanghai',phrase:'A little old town. A little skyline.',why:'Start on the waterfront, wander the old city over lunch, then slow down with tea.',ids:['sh-bund','sh-oldtown','sh-tea'],times:['09:00','12:00','15:00']},Singapore:{tz:'Asia/Singapore',phrase:'Local stories, hawker flavors, open skies.',why:'Explore Kampong Gelam before lunch in Chinatown, with Marina Bay later in the day.',ids:['sg-kampong','sg-chinatown','sg-marina'],times:['09:00','12:00','17:00']},Bangkok:{tz:'Asia/Bangkok',phrase:'Riverfront craft and a taste of the old town.',why:'Make space for food and a hands-on workshop, with generous gaps between stops.',ids:['food','craft'],times:['11:30','14:00']}};
const items=()=>cityInfo[S.city].ids.filter(id=>!S.removed.includes(id)).map((id,i)=>({...CATALOG.find(e=>e.id===id),time:cityInfo[S.city].times[cityInfo[S.city].ids.indexOf(id)]}));
const total=()=>items().reduce((n,e)=>n+e.price*S.travelers,0);
const dateLabel=()=>new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(S.date+'T00:00:00Z'));
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hidden'),3500)}
const heading=(label,title,sub)=>'<div class="page-heading"><div><div class="eyebrow muted" style="margin-bottom:12px">'+label+'</div><h1>'+title+'</h1><p>'+sub+'</p></div><button class="pill" data-action="connections">'+icon('link')+' Connection status</button></div>';
const planSummary=()=>'<div class="row" style="flex-wrap:wrap"><span class="badge gray">'+esc(S.city)+'</span><span class="small muted">'+dateLabel()+' · '+S.travelers+' travelers · '+cityInfo[S.city].tz+'</span></div>';
function nav(){document.getElementById('nav').innerHTML=pages.map(([id,label,i])=>'<button class="nav '+(S.view===id?'active':'')+'" data-view="'+id+'" aria-current="'+(S.view===id?'page':'false')+'">'+icon(i)+label+'</button>').join('')}
function planView(){return heading('Your next chapter','Where will curiosity take you?','Tell your travel companion what matters. Shape a day you love, then let your agent help with the details.')+
 '<div class="layout"><section class="panel"><div class="panel-title"><div class="row"><div class="bubble-icon">'+icon('spark')+'</div><div><h3>Your travel companion</h3><p class="small muted">A little guidance. A plan that feels like you.</p></div></div><span class="badge gray">AI pending</span></div><form class="pad stack" id="brief-form"><div class="grid2"><label class="field">Destination<select name="city">'+Object.keys(cityInfo).map(c=>'<option'+(S.city===c?' selected':'')+'>'+c+'</option>').join('')+'</select></label><label class="field">Travel date<input type="date" name="date" required value="'+S.date+'"></label><label class="field">Travelers<input type="number" min="1" max="8" name="travelers" required value="'+S.travelers+'"></label><label class="field">Experience budget · THB<input type="number" min="1" max="1000000" name="budget" required value="'+S.budget+'"></label></div><div class="tight"><span class="field">What would make your day?</span><div class="chips">'+['Culture','Food','Nature','Shopping','Wellness'].map(t=>'<button type="button" class="chip" data-interest="'+t+'" aria-pressed="'+S.interests.includes(t)+'">'+t+'</button>').join('')+'</div></div><label class="field">Anything your companion should know?<textarea name="notes" maxlength="600" placeholder="A slower pace, less walking, traveling with children…">'+esc(S.notes)+'</textarea></label><div class="context">'+icon('shield')+'<span>You decide what gets booked. Your agent checks prices and asks for approval before making a paid reservation.</span></div><div class="split-actions"><button class="btn" type="submit">Preview example itinerary '+icon('arrow')+'</button><button class="btn secondary" type="button" data-action="connections">Connect AI later</button></div><p class="small muted">This preview uses a curated example. Free-text AI recommendations become available after an AI service is connected.</p></form></section><aside class="right-stack stack"><div class="hero-card"><div class="orbit"></div><div class="eyebrow">From idea to itinerary</div><h2 style="max-width:260px;margin-top:12px">Less planning.<br>More being there.</h2><p>One place for your ideas, reservations and the little reminders that make a trip easier.</p><div class="row" style="margin-top:22px"><span class="badge" style="background:#ffffff14;color:#e6ecdf">01 Discover</span><span class="badge" style="background:#ffffff14;color:#e6ecdf">02 Make it happen</span></div></div><section class="panel pad"><div class="eyebrow muted" style="margin-bottom:9px">How your companion helps</div><div class="journey-step"><span class="number">1</span><div><h3>Find your kind of day</h3><p>Suggestions that fit your interests, dates and pace.</p></div></div><div class="journey-step"><span class="number">2</span><div><h3>Review the details</h3><p>See what is bookable, what it costs and what is still an estimate.</p></div></div><div class="journey-step"><span class="number">3</span><div><h3>Keep everything on track</h3><p>Confirm actions once. Follow bookings and reminders in Agent tasks.</p></div></div></section><a class="btn secondary full" href="./">'+icon('map')+' Browse the current experience catalog</a></aside></div>'}
function itineraryView(){if(!S.plan)return heading('Your day, your way','A blank page. Plenty of possibility.','Start with a few preferences and turn them into a day worth looking forward to.')+'<section class="panel empty"><div class="bubble-icon">'+icon('map')+'</div><h2>No itinerary yet</h2><p class="muted">Your chosen experiences will appear here.</p><button class="btn" data-view="plan">Plan a trip '+icon('arrow')+'</button></section>';
 const list=items();return heading('Your day, your way',S.city+', at your own pace.',cityInfo[S.city].phrase)+'<div class="layout"><div class="stack"><div class="between">'+planSummary()+'<button class="btn plain" data-view="plan">'+icon('edit')+' Edit brief</button></div><div class="chat"><div class="between"><div class="row"><span class="bubble-icon">'+icon('spark')+'</span><h3>A day to make your own</h3></div><span class="badge gray">Example response</span></div><p>'+cityInfo[S.city].why+'</p><p class="small muted">In the live version, this explanation will be generated from your brief and validated catalog results. These times are illustrative; availability has not been checked.</p></div><div class="timeline">'+list.map((e,i)=>(i?'<div class="transfer">Time between stops is a buffer. Transit routing will be checked before booking.</div>':'')+'<article class="trip-card"><img src="'+esc(e.img)+'" alt="'+esc(e.name)+' illustration"><div class="trip-content"><div class="between"><span class="trip-time">'+e.time+' · '+e.duration+' MIN</span><span class="badge gray">Sample experience</span></div><div><h3>'+esc(e.name)+'</h3><p class="small muted">'+esc(e.venue)+'</p></div><p class="why">'+esc(e.does[0]||'A local experience from the Journey Hub sample catalog.')+'</p><div class="between"><span class="price">'+money(e.price*S.travelers)+' <span class="small muted">/ '+S.travelers+' guests</span></span><button class="btn plain" data-remove="'+e.id+'">Remove</button></div></div></article>').join('')+'</div>'+(list.length?'':'<div class="panel empty">No stops selected. Restore the example to continue.</div>')+'<div class="plan-controls"><button class="btn secondary" data-action="restore">Restore example stops</button><button class="btn secondary" data-action="revise">'+icon('spark')+' Ask for a change</button><button class="btn secondary" data-action="save">'+icon('check')+(S.saved?' Draft saved locally':' Save draft locally')+'</button></div></div><aside class="stack"><section class="panel"><div class="panel-title"><h3>Your plan at a glance</h3><span class="badge amber">Draft</span></div><div class="pad stack"><div class="moneyline"><span>'+list.length+' experiences · '+S.travelers+' travelers</span><b>'+money(total())+'</b></div><div class="moneyline"><span>Meals, transport & separate tickets</span><span class="muted">Not included</span></div><div class="moneyline total"><span>Experience subtotal</span><span>'+money(total())+'</span></div><div class="feedback '+(total()>S.budget?'error':'')+'">'+(total()>S.budget?'Over your experience budget by '+money(total()-S.budget)+'. Remove a stop or edit your budget.':money(S.budget-total())+' left in your experience budget. Meals and transfers need a separate allowance.')+'</div><button class="btn full" data-action="review" '+(!list.length||total()>S.budget?'disabled':'')+'>Review agent actions '+icon('arrow')+'</button><p class="small muted">Review travelers, final prices, provider terms and email preferences before any live action.</p></div></section><section class="panel pad stack"><div class="row">'+icon('clock')+'<h3>Be there, on time</h3></div><p class="small muted">Choose reminders when you review actions. You can change or stop them from Agent tasks.</p><div class="context"><span class="small">All itinerary times use '+cityInfo[S.city].tz+'. A live booking must retain the provider’s currency.</span></div></section></aside></div>'}
function tasksView(){return heading('Your agent, at work','Every detail. In plain sight.','A clear record of what needs your approval, what is underway and what has been confirmed.')+(!S.plan?'<section class="panel empty"><div class="bubble-icon">'+icon('task')+'</div><h2>No tasks yet</h2><p class="muted">Build an itinerary and review the actions you want your agent to take.</p><button class="btn" data-view="plan">Plan a trip</button></section>':'<div class="layout"><div class="stack"><div class="between">'+planSummary()+'<span class="badge amber">Simulated workflow</span></div>'+items().map((e,i)=>'<article class="task"><div class="task-top"><div class="row"><span class="bubble-icon">'+icon('ticket')+'</span><div><h3>'+esc(e.name)+'</h3><p class="small muted">Reserve '+S.travelers+' places · '+e.time+' local time</p></div></div><span class="badge '+(S.taskState==='complete'?'':'amber')+'">'+(S.taskState==='complete'?'Simulation complete':S.taskState==='paused'?'Paused':S.taskState==='running'?'Simulating':'Needs approval')+'</span></div><div class="track"><span class="done"></span><span class="'+(S.taskState!=='draft'?'done':'')+'"></span><span class="'+(S.taskState==='complete'?'done':'')+'"></span><span class="'+(S.taskState==='complete'?'done':'')+'"></span></div><div class="between"><span class="small muted">'+(S.taskState==='complete'?'Preview only. No reservation or ticket was created.':'Final availability, provider price and terms must be checked.')+'</span><b class="small">'+money(e.price*S.travelers)+'</b></div></article>').join('')+'<article class="task"><div class="task-top"><div class="row"><span class="bubble-icon">'+icon('mail')+'</span><div><h3>Keep me in the loop</h3><p class="small muted">Itinerary email and a reminder 24 hours before the first stop</p></div></div><span class="badge gray">'+(S.reminder?'Preview enabled':'Not requested')+'</span></div><p class="small muted">Email service is not connected. No email has been scheduled or sent.</p><button class="btn secondary" data-action="email">Preview email</button></article><div class="plan-controls"><button class="btn" data-action="review" '+(S.busy?'disabled':'')+'>Review actions</button><button class="btn secondary" data-action="pause" '+(S.busy?'disabled':'')+'>Pause preview tasks</button><button class="btn secondary" data-action="failure">Preview a price change</button></div></div><aside class="stack"><section class="panel pad stack"><div class="row">'+icon('shield')+'<h3>You stay in control</h3></div><p class="small muted">Your approval covers specific items, travelers, currency and a maximum total. A material change brings the task back to you.</p><div class="statusline"><span class="small">Paid reservations</span><b class="small">Approval first</b></div><div class="statusline"><span class="small">Email reminders</span><b class="small">Opt in</b></div><div class="statusline"><span class="small">Live confirmations</span><b class="small">Provider receipt required</b></div></section><section class="panel pad stack"><h3>Activity</h3><div class="tasklog">'+(S.taskLog.length?S.taskLog.map(x=>'<div>'+esc(x)+'</div>').join(''):'<div>Example itinerary ready for review.</div><div>No external action has been taken.</div>')+'</div></section></aside></div>')}
function blueprintView(){return heading('Product & implementation blueprint','Advice that can become action.','A provider-neutral plan for a real AI travel service, with Supabase as the application backend.')+document.getElementById('blueprint-template').innerHTML}
function render(){nav();document.getElementById('main').innerHTML=({plan:planView,itinerary:itineraryView,tasks:tasksView,blueprint:blueprintView})[S.view]()+(S.view==='itinerary'&&S.plan?'<div class="mobile-review"><button class="btn" data-action="review" '+(!items().length||total()>S.budget?'disabled':'')+'>Review actions · '+money(total())+' '+icon('arrow')+'</button></div>':'')+'<footer class="footnote"><span>JOURNEY HUB · TRAVEL COMPANION CONCEPT · OCTOBER 2026</span><span>English interface · Bangkok / Shanghai / Singapore</span></footer>'}
function readBrief(){const f=document.getElementById('brief-form');if(!f)return;const d=new FormData(f);S.city=d.get('city');S.date=d.get('date');S.travelers=Number(d.get('travelers'));S.budget=Number(d.get('budget'));S.notes=String(d.get('notes'));}
function openModal(title,body){const d=document.getElementById('dialog');if(d.open)d.close();d.innerHTML='<div class="modal-top"><h2 id="dialog-title">'+title+'</h2><button class="close" data-action="close" aria-label="Close dialog">×</button></div><div class="modal-body">'+body+'</div>';d.showModal()}
function closeModal(){document.getElementById('dialog').close()}
function connections(){openModal('Connection roadmap','<p class="muted small">Choose the AI provider after reviewing this design. Credentials are configured on the server.</p>'+[['Database','Current catalog: Supabase','Connected in the existing app'],['AI recommendations','Provider and model to be selected','Not configured'],['Tickets & payments','Operator inventory and checkout integration','Not configured'],['Email delivery','Transactional email provider and verified sender','Not configured'],['Background tasks','Supabase task store, queue and scheduled worker','Planned']].map(([a,b,c])=>'<div class="connection"><div class="between"><h3>'+a+'</h3><span class="badge gray">'+c+'</span></div><p class="small muted">'+b+'</p></div>').join('')+'<a href="./" class="btn secondary">Open the existing app</a>')}
function review(){if(!S.plan||!items().length){toast('Preview an itinerary first.');return}if(total()>S.budget){toast('Adjust the plan to fit your experience budget first.');return}openModal('Review before your agent acts',planSummary()+'<span class="badge amber">Design preview · no live actions</span><div class="stack">'+items().map(e=>'<div class="moneyline"><span>'+esc(e.name)+'<br><span class="muted">'+e.time+' · '+S.travelers+' guests</span></span><b>'+money(e.price*S.travelers)+'</b></div>').join('')+'</div><div class="moneyline total"><span>Sample subtotal</span><span>'+money(total())+'</span></div><div class="notes">In production, this screen shows provider availability, a quote expiry, taxes and fees, cancellation terms, the charge currency and your maximum authorized total. A changed quote requires another review.</div><label class="checkline"><input type="checkbox" id="consent-reminder" '+(S.reminder?'checked':'')+'><span>Email my itinerary and remind me 24 hours before the first stop.<br><span class="muted small">Example recipient: traveler@example.com. No email will be sent in this preview.</span></span></label><button class="btn full" data-action="simulate">Preview the execution flow '+icon('arrow')+'</button><p class="small muted">This button simulates status changes only. It does not call a booking or email service.</p>')}
function emailPreview(){openModal('Email content preview','<span class="badge gray">Not sent</span><div class="tight small"><p><b>To:</b> traveler@example.com</p><p><b>Subject:</b> Your '+esc(S.city)+' day starts tomorrow</p></div><div class="rule"></div><h2>A little reminder for a great day.</h2><p>Hi Traveler,</p><p>Your first experience is coming up. Here are the details to keep handy.</p><div class="context"><span><b>'+esc(items()[0]?.name||'Your first experience')+'</b><br>'+dateLabel()+' · '+(items()[0]?.time||'09:00')+' · '+cityInfo[S.city].tz+'<br>'+S.travelers+' guests<br>Meeting point: supplied by the operator after confirmation.</span></div><p class="small muted">Live emails include a secure booking link, the provider’s confirmation reference and the latest meeting instructions.</p><button class="btn secondary" data-action="close">Back to my trip</button><p class="small muted">You requested trip reminders from Journey Hub. Live emails include a link to manage or stop reminders.</p>')}
function failurePreview(){openModal('A price changed. Your call.', '<span class="badge amber">Action needed · sample scenario</span><p>The provider returned a different quote. Your agent has paused before payment.</p><div class="moneyline"><span>Previously reviewed total</span><b>'+money(total())+'</b></div><div class="moneyline"><span>New example quote</span><b>'+money(total()+300)+'</b></div><div class="notes">In production, show the exact changed item, currency, expiry and cancellation terms. Keep already-confirmed items visible. Never retry an uncertain charge without checking the provider first.</div><button class="btn" data-action="close">Return to review</button><button class="btn secondary" data-action="close">Keep the current plan</button>')}
document.addEventListener('submit',e=>{if(e.target.id!=='brief-form')return;e.preventDefault();readBrief();S.plan=true;S.removed=[];S.taskState='draft';S.taskLog=[];S.saved=false;S.view='itinerary';render();window.scrollTo(0,0)});
document.addEventListener('change',e=>{if(e.target.closest('#brief-form'))readBrief()});
document.addEventListener('click',async e=>{
 const b=e.target.closest('button,[data-view]');if(!b||b.disabled)return;
 if(b.dataset.view){readBrief();S.view=b.dataset.view;render();window.scrollTo(0,0);return}
 if(b.dataset.interest){readBrief();const v=b.dataset.interest;S.interests=S.interests.includes(v)?S.interests.filter(x=>x!==v):[...S.interests,v];render();return}
 if(b.dataset.remove){S.removed.push(b.dataset.remove);S.taskState='draft';S.saved=false;render();return}
 const a=b.dataset.action;
 if(a==='close')closeModal();
 if(a==='connections')connections();
 if(a==='review')review();
 if(a==='email')emailPreview();
 if(a==='failure')failurePreview();
 if(a==='restore'){S.removed=[];S.taskState='draft';S.saved=false;render()}
 if(a==='pause'){S.taskState='paused';S.taskLog.push('Preview tasks paused. No external actions are running.');render()}
 if(a==='save'){S.saved=true;try{sessionStorage.setItem('journeyhub-design-draft',JSON.stringify({city:S.city,date:S.date,travelers:S.travelers,budget:S.budget,removed:S.removed}));toast('Draft saved in this tab.')}catch{S.saved=false;toast('Browser storage is unavailable. The draft is still visible.')}render()}
 if(a==='revise')openModal('Make it more you','<p>In the live product, this opens a conversation with your AI companion while keeping the itinerary visible.</p><div class="chips"><button class="chip" data-action="connections">Less walking</button><button class="chip" data-action="connections">More local food</button><button class="chip" data-action="connections">An indoor alternative</button></div><p class="small muted">Free-text planning is waiting for an AI connection. You can edit the brief or remove stops in this preview.</p><button class="btn" data-action="close">Back to itinerary</button>');
 if(a==='simulate'){
  S.reminder=document.getElementById('consent-reminder').checked;S.busy=true;S.taskState='running';S.taskLog=['Preview approval recorded. No real authorization was stored.'];closeModal();S.view='tasks';render();window.scrollTo(0,0);
  await new Promise(r=>setTimeout(r,700));S.taskLog.push('Simulated availability and price check.');render();
  await new Promise(r=>setTimeout(r,700));S.taskState='complete';S.busy=false;S.taskLog.push('Simulation complete. No booking, payment or email was created.');render();
 }
});
document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
try{const d=JSON.parse(sessionStorage.getItem('journeyhub-design-draft')||'null');if(d&&cityInfo[d.city]&&/^\d{4}-\d{2}-\d{2}$/.test(d.date)&&Number.isInteger(d.travelers)&&d.travelers>=1&&d.travelers<=8&&d.budget>0){Object.assign(S,d);S.removed=Array.isArray(d.removed)?d.removed.filter(x=>cityInfo[d.city].ids.includes(x)):[];S.plan=true;S.saved=true;}}catch{}
window.addEventListener('DOMContentLoaded',render);
</script>
<template id="blueprint-template">__BLUEPRINT__</template>
</body></html>
