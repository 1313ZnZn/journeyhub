<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JourneyHub · Map connection check</title><style>body{margin:0;font:16px system-ui;background:#f8faf6;color:#254d3e}main{max-width:780px;margin:28px auto;padding:20px}h1{font-size:26px}#status{padding:16px;border-radius:14px;background:#e8eee5;line-height:1.5}#map{height:480px;margin-top:18px;border-radius:18px}a{color:inherit}</style><main><h1>Map connection check</h1><p id="status" role="status">Loading Google Maps…</p><div id="map" aria-label="Google map connection test"></div><p>This check loads one map. It does not search places, call AI or make reservations.</p><a href="./">Back to JourneyHub</a></main><script src="./config.js"></script><script>
let failed=false;
const status=document.querySelector('#status');
window.gm_authFailure=()=>{failed=true;status.textContent='Google Maps rejected access for this website. Check the browser key website restrictions.';status.dataset.result='failed';};
window.journeyMapReady=()=>{try{const map=new google.maps.Map(document.querySelector('#map'),{center:{lat:13.7465,lng:100.493},zoom:13,mapTypeControl:false,streetViewControl:false});google.maps.event.addListenerOnce(map,'tilesloaded',()=>{if(!failed){status.textContent='Google Maps is working on this website.';status.dataset.result='ready';}});}catch{failed=true;status.textContent='The map could not initialize.';status.dataset.result='failed';}};
(async()=>{try{const c=window.JOURNEYHUB_CONFIG;const r=await fetch(c.url+'/functions/v1/journeyhub-agent?action=maps_config',{headers:{apikey:c.publishableKey},cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();if(!data.ready||!data.browserKey)throw Error();const script=document.createElement('script');script.async=true;script.src='https://maps.googleapis.com/maps/api/js?'+new URLSearchParams({key:data.browserKey,callback:'journeyMapReady',loading:'async',language:'en',v:'weekly'});script.onerror=()=>{status.textContent='Google Maps could not be reached. Check the connection.';status.dataset.result='failed';};document.head.append(script);}catch{status.textContent='The map configuration could not be loaded.';status.dataset.result='failed';}})();
</script></html>
