<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Journey Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a phone-sized app (full screen on phones, framed device beside a demo guide on desktop) */
:root{
  --font:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#E4EAE6; --ground:#F3F5F1; --surface:#FFFFFF; --surface-2:#F3F5F1; --surface-3:#E3E9E5;
  --ink:#15201C; --ink-2:#46554F; --ink-3:#5E6B65; --line:#DCE3DE; --line-strong:#C9D3CD;
  --forest:#0F5E4A; --forest-ink:#FFFFFF; --deep:#0C3B30; --on-deep:#FFFFFF; --on-deep-2:#BFE0D2; --deep-2:#1A5446; --deep-line:#2C6B59;
  --mint:#E2EFE8; --mint-ink:#0C3B30; --marigold:#F2A93B; --on-marigold:#15201C;
  --warn-bg:#FFF3DC; --warn-line:#F2C57A; --warn-ink:#7A4A00; --warn-ink-2:#5C3800;
  --info-bg:#EAEFF5; --info-ink:#24405E; --danger:#9A2E24;
  --chart-1:#087F5B; --chart-2:#4A6FD0; --chart-hover:rgba(8,127,91,.08);
  --map-land:#E9EFE7; --map-land-2:#E1E8DE; --map-water:#A9CCD8; --map-road:#FFFFFF; --map-park:#CFE3C9; --map-label:#5E6B65; --map-water-label:#3F6F7F; --map-rail:#6E9C8B;
  --shadow:rgba(12,59,48,.16); --scrim:rgba(12,22,18,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080C0B; --ground:#101715; --surface:#18211E; --surface-2:#1F2A26; --surface-3:#26332E;
    --ink:#E8EFEB; --ink-2:#B3C2BB; --ink-3:#97A79F; --line:#2A3631; --line-strong:#3A4842;
    --forest:#5CC7A0; --forest-ink:#06231A; --deep:#0D2A22; --on-deep:#E8EFEB; --on-deep-2:#9FCDB9; --deep-2:#16392F; --deep-line:#245244;
    --mint:#193A30; --mint-ink:#BFE9D6; --marigold:#F2B04F; --on-marigold:#15201C;
    --warn-bg:#33270F; --warn-line:#6B5122; --warn-ink:#F5C873; --warn-ink-2:#E9CF9A;
    --info-bg:#1C2733; --info-ink:#A9C4E4; --danger:#F08A7E;
    --chart-1:#2A9E76; --chart-2:#6F8DE0; --chart-hover:rgba(92,199,160,.10);
    --map-land:#18221E; --map-land-2:#141D1A; --map-water:#22404A; --map-road:#2C3833; --map-park:#1F3A2A; --map-label:#97A79F; --map-water-label:#8FB9C7; --map-rail:#4E8A76;
    --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080C0B; --ground:#101715; --surface:#18211E; --surface-2:#1F2A26; --surface-3:#26332E;
  --ink:#E8EFEB; --ink-2:#B3C2BB; --ink-3:#97A79F; --line:#2A3631; --line-strong:#3A4842;
  --forest:#5CC7A0; --forest-ink:#06231A; --deep:#0D2A22; --on-deep:#E8EFEB; --on-deep-2:#9FCDB9; --deep-2:#16392F; --deep-line:#245244;
  --mint:#193A30; --mint-ink:#BFE9D6; --marigold:#F2B04F; --on-marigold:#15201C;
  --warn-bg:#33270F; --warn-line:#6B5122; --warn-ink:#F5C873; --warn-ink-2:#E9CF9A;
  --info-bg:#1C2733; --info-ink:#A9C4E4; --danger:#F08A7E;
  --chart-1:#2A9E76; --chart-2:#6F8DE0; --chart-hover:rgba(92,199,160,.10);
  --map-land:#18221E; --map-land-2:#141D1A; --map-water:#22404A; --map-road:#2C3833; --map-park:#1F3A2A; --map-label:#97A79F; --map-water-label:#8FB9C7; --map-rail:#4E8A76;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
img{display:block}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* stage */
.stage{height:100%;display:flex;justify-content:center;align-items:stretch;gap:40px}
.guide{display:none}
.device{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--ground);overflow:hidden}
@media (min-width:920px){
  .stage{padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center}
  .guide{display:flex;flex-direction:column;gap:18px;width:330px;max-height:100%;overflow:auto;padding:4px 4px 4px 0}
  .device{width:400px;height:min(860px,100%);border-radius:34px;border:1px solid var(--line-strong);box-shadow:0 30px 60px -24px var(--shadow)}
}

/* guide panel */
.g-brand{display:flex;align-items:center;gap:10px}
.g-title{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.5px;text-wrap:balance}
.g-text{font-size:14px;line-height:21px;color:var(--ink-2)}
.g-card{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.g-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.g-step{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 8px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink)}
.g-step:hover{background:var(--surface-2)}
.g-dot{width:22px;height:22px;flex:none;border-radius:999px;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink-3)}
.g-step.done .g-dot{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.g-step.done .g-lbl{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.g-lbl{flex:1}
.g-sub{font-size:12px;color:var(--ink-3)}

/* app chrome */
.bar{display:flex;align-items:center;gap:6px;padding-block:10px 8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--ground);flex:none}
.bar.deep{background:var(--deep);color:var(--on-deep);padding-block:12px 14px}
.bar.top{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 6px}
.bar-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bar-title{font-size:17px;font-weight:800;line-height:22px}
.bar-sub{font-size:12px;color:var(--ink-2)}
.bar.deep .bar-sub{color:var(--on-deep-2)}
.icon-btn{width:44px;height:44px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;color:inherit;position:relative}
.icon-btn:hover{background:var(--surface-3)}
.bar.deep .icon-btn:hover{background:var(--deep-2)}
.icon-btn.ring{border:1px solid var(--line);background:var(--surface)}
.bar.deep .icon-btn.ring{border-color:var(--deep-line);background:transparent}
.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:999px;background:var(--marigold);border:2px solid var(--surface)}
.count{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--forest);color:var(--forest-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--ground)}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.content{display:flex;flex-direction:column;gap:18px;padding-block:8px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.content.tight{gap:14px}
.foot{flex:none;display:flex;flex-direction:column;gap:10px;padding-block:12px 16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line)}
.foot-row{display:flex;align-items:center;gap:14px}
.tabbar{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-block:6px 10px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding-top:4px;font-size:11px;font-weight:500;color:var(--ink-3)}
.tab-pill{position:relative;width:56px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.tab[aria-current="page"]{color:var(--mint-ink);font-weight:800}
.tab[aria-current="page"] .tab-pill{background:var(--mint)}
.tab-badge{position:absolute;top:-2px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--forest);color:var(--forest-ink);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* type */
.display{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.6px;text-wrap:balance}
.h1{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.5px;text-wrap:balance}
.h2{font-size:19px;line-height:24px;font-weight:700;text-wrap:balance}
.h3{font-size:16px;line-height:21px;font-weight:700}
.lead{font-size:15px;line-height:22px;color:var(--ink-2)}
.meta{font-size:13px;line-height:18px;color:var(--ink-2)}
.cap{font-size:12px;line-height:16px;color:var(--ink-3)}
.label{font-size:13px;font-weight:700;color:var(--ink-2)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2)}
.price{font-weight:800;color:var(--forest)}
.wordmark{font-size:17px;font-weight:800;letter-spacing:-.2px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link{font-size:14px;font-weight:700;color:var(--forest);min-height:32px;display:inline-flex;align-items:center}
.link:hover{text-decoration:underline}
.stack{display:flex;flex-direction:column;gap:4px}
.stack-8{display:flex;flex-direction:column;gap:8px}
.stack-12{display:flex;flex-direction:column;gap:12px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.pad-0{padding:0;overflow:hidden}
.card.deep{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.card.deep .meta,.card.deep .cap{color:var(--on-deep-2)}
.card.mint{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink-2)}
.card.sel{border:2px solid var(--forest)}
.card.accent{border:2px solid var(--marigold)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 14px;color:var(--ink);text-align:left}
.li + .li{border-top:1px solid var(--line)}
button.li:hover{background:var(--surface-2)}
.li-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-title{font-size:15px;font-weight:700}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--surface-3)}
.thumb.sm{width:40px;height:40px;border-radius:10px}
.thumb.lg{width:76px;height:76px}
.tile-ic{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--mint);color:var(--mint-ink)}
.tile-ic.warm{background:var(--warn-bg);color:var(--warn-ink)}
.tile-ic.plain{background:var(--surface-2);color:var(--ink-2)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--mint);color:var(--mint-ink);font-size:13px;line-height:18px}
.notice.warn{background:var(--warn-bg);color:var(--warn-ink-2)}
.notice.plain{background:var(--surface-2);color:var(--ink-2)}
.notice svg{flex:none}
.hr{height:1px;background:var(--line)}
.sum{display:flex;flex-direction:column;gap:10px;font-size:14px}
.sum-row{display:flex;justify-content:space-between;gap:12px}
.sum-row span:first-child{color:var(--ink-2)}
.sum-row span:last-child{font-weight:600;text-align:right}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.sum-total .big{font-size:21px;font-weight:800}

/* controls */
.btn{min-height:52px;padding:0 20px;border-radius:14px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-primary{background:var(--forest);color:var(--forest-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-soft{background:var(--mint);color:var(--mint-ink)}
.btn-outline{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn-marigold{background:var(--marigold);color:var(--on-marigold)}
.btn-text{min-height:44px;padding:0 10px;font-size:14px;font-weight:700;color:var(--forest);border-radius:10px}
.btn-danger{min-height:44px;padding:0 10px;font-size:14px;font-weight:700;color:var(--danger);border-radius:10px}
.btn-sm{min-height:44px;font-size:14px;padding:0 16px;border-radius:12px}
.btn-block{width:100%}
.btn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-left:calc(-1 * max(20px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(20px,env(safe-area-inset-right,0px)));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.chip.on-deep{border-color:var(--deep-line);background:transparent;color:var(--on-deep)}
.chip.on-deep[aria-pressed="true"]{background:var(--on-deep);color:var(--deep);border-color:var(--on-deep)}
.seg{display:grid;gap:4px;padding:4px;border-radius:14px;background:var(--surface-3)}
.seg button{min-height:42px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--mint-ink);font-weight:800;box-shadow:0 1px 2px var(--shadow)}
.stepper{display:flex;align-items:center;gap:4px}
.step-btn{width:44px;height:44px;border-radius:12px;background:var(--mint);color:var(--mint-ink);display:flex;align-items:center;justify-content:center}
.step-val{min-width:34px;text-align:center;font-size:17px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.input{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2)}
.input:focus-within{border-color:var(--forest);box-shadow:0 0 0 3px var(--mint)}
.input input,.input select{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;font-weight:500;color:var(--ink);min-height:48px}
.input input::placeholder{color:var(--ink-3)}
textarea.ta{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px;line-height:21px;resize:none;outline:none}
textarea.ta:focus{border-color:var(--forest);box-shadow:0 0 0 3px var(--mint)}
.stepper-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line-strong)}
.opt{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.opt:has(input:checked){border:2px solid var(--forest);box-shadow:0 0 0 3px var(--mint)}
.opt.disabled{background:var(--surface-2);border-style:dashed;color:var(--ink-3);cursor:not-allowed}
.opt input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--forest)}
.check{display:flex;gap:12px;padding:14px 16px;cursor:pointer}
.check + .check{border-top:1px solid var(--line)}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--forest)}
.check.auto{cursor:default}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;line-height:16px}
.b-ok{background:var(--mint);color:var(--mint-ink)}
.b-warn{background:var(--warn-bg);color:var(--warn-ink)}
.b-muted{background:var(--surface-2);color:var(--ink-2)}
.b-info{background:var(--info-bg);color:var(--info-ink)}
.b-live{background:var(--forest);color:var(--forest-ink)}
.b-live::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--marigold)}
.b-mari{background:var(--marigold);color:var(--on-marigold)}

/* welcome / hero */
.welcome{display:flex;flex-direction:column;gap:18px;padding-block:18px 24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brandrow{display:flex;align-items:center;gap:10px}
.hero-img{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:16/11;max-width:100%;background:var(--deep)}
.hero-img img{width:100%;height:100%;object-fit:cover}
.weave{position:absolute;left:0;right:0;bottom:0;height:10px;display:block}
.role-card{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.role-card:hover{border-color:var(--forest)}
.fine{font-size:12px;line-height:16px;color:var(--ink-3);text-align:center}

/* explore */
.today{position:relative;display:flex;flex-direction:column;gap:12px;width:100%;padding:22px 18px 18px;border-radius:20px;background:var(--deep);color:var(--on-deep);overflow:hidden;text-align:left}
.today .meta{color:var(--on-deep-2)}
.today .weave{top:0;bottom:auto;height:8px}
.prog{display:flex;gap:6px}
.prog span{flex:1;height:4px;border-radius:4px;background:var(--deep-line)}
.prog span.on{background:var(--marigold)}
.carousel{display:flex;gap:12px;overflow-x:auto;margin-left:calc(-1 * max(20px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(20px,env(safe-area-inset-right,0px)));padding:0 max(20px,env(safe-area-inset-right,0px)) 4px max(20px,env(safe-area-inset-left,0px));scroll-snap-type:x mandatory;scrollbar-width:none}
.xcard{flex:none;width:224px;display:flex;flex-direction:column;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;text-align:left;scroll-snap-align:start}
.xcard img{width:100%;height:132px;object-fit:cover;background:var(--surface-3)}
.xcard-b{display:flex;flex-direction:column;gap:4px;padding:12px 14px 14px}
.rating{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--ink)}
.rating svg{color:var(--warn-ink)}
.results{display:flex;flex-direction:column;gap:10px}

/* experience */
.cover{position:relative;height:250px;flex:none;background:var(--deep)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .icon-btn{position:absolute;top:14px;background:var(--surface);color:var(--ink);box-shadow:0 2px 8px var(--shadow)}
.cover .icon-btn:hover{background:var(--surface)}
.cover-tag{position:absolute;left:16px;bottom:14px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:10px}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center}
.slot[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.slot small{font-size:12px;font-weight:600}

function travelerSteps(o, inf) {
  const order = ['preparing', 'combined', 'out', 'delivered']; const idx = order.indexOf(o.status);

  const step = (c, t, sub, extra, last) => '<li class="st ' + c + '"><span class="st-rail"><span class="st-dot">' + (c === 'done' ? ic('check', 12) : '') + '</span>' + (last ? '' : '<span class="st-line"></span>') + '</span><span class="st-body"><span class="st-t">' + t + '</span><span class="cap">' + sub + '</span>' + (extra || '') + '</span></li>';
  const items = inf.lines.map((l) => { const at = !l.p.mto || o.scarfAtHub; return '<span class="item-row"><img class="thumb sm" style="width:36px;height:36px;border-radius:8px" src="' + l.p.img + '" alt=""><span class="li-main"><span style="font-size:13px;font-weight:700">' + l.p.name + ' × ' + l.qty + '</span><span class="cap">' + (at ? 'At Silom Hub' : 'Ready ' + readyLabel(o) + ', 12:00') + '</span></span>' + (at ? badge('Ready', 'b-ok') : badge('Delayed', 'b-warn')) + '</span>'; }).join('');
  return '<ol class="steps">' +
    step('done', 'Order placed', placedLabel(o) + ', ' + o.placedAt) +
    step(cls(0), 'Preparing at stores' + (idx === 0 ? ' · now' : ''), 'Each store packs and sends its items to Silom Hub', '<span class="stack-8" style="margin-top:8px">' + items + '</span>') +
    step(cls(1), 'Combined at Silom Hub', idx >= 1 ? 'One parcel, sealed' : 'After every item arrives') +
    step(cls(2), o.method === 'hotel' ? 'Out for delivery' : 'In transit', o.method === 'hotel' ? 'Courier picks up at the hub' : 'Tracked international courier') +
    step(o.status === 'delivered' ? 'done' : '', o.method === 'hotel' ? 'Handed to concierge' : 'Delivered', esc(addrLine(o)) + (o.method === 'hotel' ? ' · signature on handover' : ''), '', true) +
    '</ol>';
}

function vatState() {
  const items = myOrders().length ? myOrders().flatMap((o) => o.items) : Object.keys(state.cart).filter((k) => state.cart[k]).map((k) => ({ pid: k, qty: state.cart[k] }));
  const storeIds = Array.from(new Set(items.map((i) => PRODUCTS[i.pid].store)));
  const forms = storeIds.map((sid) => {
    const spend = sum(items.filter((i) => PRODUCTS[i.pid].store === sid), (i) => PRODUCTS[i.pid].price * i.qty);
    const orders = myOrders().filter((o) => o.items.some((i) => PRODUCTS[i.pid].store === sid));
    const got = orders.length > 0 && orders.every((o) => o.items.filter((i) => PRODUCTS[i.pid].store === sid).every((i) => !PRODUCTS[i.pid].mto || o.scarfAtHub));
    const pending = orders.length > 0 && !got;
    return { sid, spend, got, pending, ordered: orders.length > 0 };
  });
  const steps = [
    { t: 'Shop at participating stores', n: storeIds.length ? 'Both stores in Journey Hub issue VAT refund forms.' : 'Add items from a store first.', done: storeIds.length > 0, auto: true },
    { t: 'Add your passport details', n: state.passport ? 'Added · passport ending ' + esc(state.passport.last4) : 'Stores need them to fill in the refund form.', done: !!state.passport, auto: true },
    { t: 'Collect a form and tax invoice from each store', n: forms.length ? 'Form P.P.10 plus the original invoice · ' + forms.filter((f) => f.got).length + ' of ' + forms.length + ' received' : 'Form P.P.10 plus the original invoice.', done: forms.length > 0 && forms.every((f) => f.got), auto: true },
    { t: 'Keep the goods with you, unused', n: 'Customs may ask to see them when you depart.', done: !!state.vatManual[3], auto: false, k: 3 },

/* ---------- QR codes: byte mode, error correction M, versions 1–10 (ISO/IEC 18004) ---------- */
const QR = (() => {

  function rsRemainder(data, div) { const r = div.map(() => 0); data.forEach((b) => { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= gfMul(c, f); }); }); return r; }
  function alignPositions(v, size) { if (v === 1) return []; const n = Math.floor(v / 7) + 2; const step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2; const out = [6]; for (let pos = size - 7; out.length < n; pos -= step) out.splice(1, 0, pos); return out; }
  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1; for (; v <= 10; v++) { const cap = dataCodewords(v) * 8; const need = 4 + (v < 10 ? 8 : 16) + bytes.length * 8; if (need <= cap) break; }
    if (v > 10) throw new Error('QR payload too long');
    const bits = []; const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach((b) => put(b, 8));
